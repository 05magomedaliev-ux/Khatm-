name: update
on:
  push:
    paths:
      - '*.zip'
      - .github/workflows/update.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shopt -s nullglob
          for f in *.zip; do
            unzip -o "$f" -x '.github/*'
            git rm -q "$f"
          done
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || { git commit -m "Обновление проекта"; git push; }
